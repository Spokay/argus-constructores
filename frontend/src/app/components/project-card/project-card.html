<a class="ag-card" [routerLink]="['/projects', project().id]">
  <div class="ag-card-photo">
    @if (coverUrl(); as url) {
      <img [src]="url" [alt]="project().name" loading="lazy" />
    }
  </div>
  <div class="ag-card-body">
    <p class="ag-card-sector">{{ sector() }}</p>
    <h3 class="ag-card-title">{{ project().name }}</h3>
    <dl class="ag-card-meta">
      <dt i18n="@@fact.city">Ciudad</dt>
      <dd>{{ project().city }}</dd>
      @if (area(); as area) {
        <dt i18n="@@fact.area">Área</dt>
        <dd>{{ area }}</dd>
      } @else {
        <dt i18n="@@fact.client">Contratante</dt>
        <dd>{{ project().client }}</dd>
      }
    </dl>
    <svg class="ag-card-corner" viewBox="0 0 120 40" aria-hidden="true">
      <polygon class="navy" points="40,40 120,8 120,40" />
      <polygon class="cyan" points="80,40 120,24 120,40" />
    </svg>
  </div>
</a>
