<section class="ag-section">
  <h1 class="page-title">{{ errorDetails.title }}</h1>
  <p class="page-lead">{{ errorDetails.message }}</p>
  @if (errorDetails.description) {
    <p>{{ errorDetails.description }}</p>
  }
  <div class="ag-hero-actions">
    <a routerLink="/" class="ag-btn ag-btn--primary" i18n="@@error.home">Ir al inicio</a>
    <button type="button" class="ag-btn ag-btn--secondary" (click)="goBack()" i18n="@@error.back">
      Volver
    </button>
  </div>
</section>
