server.port=8080
server.servlet.context-path=/api
spring.application.name=argus-constructores-backend

# Local secrets live in the repo-root .env (see .env.example); real environment variables win.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/argus}
spring.datasource.username=${DB_USERNAME:argus}
spring.datasource.password=${DB_PASSWORD}
# Flyway owns the schema; Hibernate only checks the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# No default on purpose: the app refuses to start without a signing key of at least 32 bytes.
jwt.secret=${JWT_SECRET}
jwt.ttl=8h

# First admin, created only while the user_account table is empty.
admin.username=${ADMIN_USERNAME:}
admin.password=${ADMIN_PASSWORD:}

# Origins allowed to call this API from a browser. Comma-separated; supports patterns.
# Only relevant when the frontend calls this server directly, i.e. its dev proxy is off.
cors.allowed-origins=http://localhost:4200

# Levels live here; logback-spring.xml owns only the format. Raising the application package
# to DEBUG is the first thing to try when a request does not do what you expect.
logging.level.root=INFO
logging.level.com.argusconstructores.api=INFO
